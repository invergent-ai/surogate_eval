# custom_eval_test.yaml
project:
  name: custom-eval-test
  version: 1.0.0
  description: Test custom evaluation with mixed exact_match and judge rows

report_format_pdf: true

targets:
  # Judge model for judge-type evaluations
  - name: qwen3-vl-judge
    type: llm
    provider: openai
    model: Qwen/Qwen3-VL-30B-A3B-Thinking-FP8
    base_url: https://app-qwen3-vl-30b-zygzu-router-rujkf.densemax.local/v1
    api_key: EMPTY

  # Target model to evaluate
  - name: qwen3-local
    type: llm
    provider: openai
    model: Qwen/Qwen3-0.6B-FP8
    base_url: https://app-qwen3-06b-ujx67-router-9bufk.densemax.local/v1
    api_key: EMPTY

    infrastructure:
      backend: local
      workers: 2

    evaluations:
      - name: custom-mixed-evaluation
        benchmarks:
          - name: mixed_eval_test
            backend: custom_eval
            source: examples/datasets/custom_eval_test.jsonl

            # Column mappings
            columns:
              instruction: instruction
              answer: answer
              eval_type: eval_type
              judge_criteria: judge_criteria

            # How exact_match rows decide whether an answer is correct.
            # Omit the whole block to get `mode: contains`, which is the
            # historical behaviour: `expected in output`. That is permissive
            # enough to score an MCQ benchmark 100% (expected "A" is
            # contained in "The answer is C."), so set a mode explicitly.
            #
            #   contains  expected appears anywhere in the output (default)
            #   exact     output equals expected, case-insensitively, ignoring
            #             trailing . ! , ; : so "D." matches a key of "D".
            #             Brackets are NOT ignored, so "D)" does not match.
            #   regex     pull the answer out of the output with `pattern`,
            #             then compare that to expected like `exact` does
            #
            # Markdown is stripped and whitespace collapsed before any of
            # them run, so `**42**` still matches `42` under `exact`. The
            # expected value itself is compared as written.
            #
            # This dataset's answers are single letters, so `regex` is the
            # mode that fits: a chatty model answers "The answer is B", which
            # `exact` scores wrong and `contains` scores right for the wrong
            # reason (every output containing a "b" would pass).
            matcher:
              mode: regex
              pattern: '\b([ABCD])\b'   # group 1 is the extracted answer
              flags: i                  # `i` only; `m`/`s` are rejected,
                                        # newlines are already collapsed
              group: 1                  # default: 1, or 0 with no groups
              timeout: 2.0              # seconds per row; must be > 0

            # Evaluation settings
            limit: 20
            max_tokens: 256

            # For judge rows (g-eval)
            judge_model:
              target: qwen3-vl-judge
            judge_criteria: "Evaluate if the response correctly answers the question based on the expected answer."