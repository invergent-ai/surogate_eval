# custom_eval_test_gpt.yaml
project:
  name: custom-eval-test-gpt
  version: 1.0.0
  description: Test custom evaluation with GPT-4o-mini as judge

targets:
  # Judge model - GPT-4o-mini
  - name: gpt4o-mini-judge
    type: llm
    provider: openai
    model: gpt-4o-mini
    api_key: ${OPENAI_API_KEY}

  # Target model to evaluate
  - name: qwen3-local
    type: llm
    provider: openai
    model: /models/admin-admin-qwen3-0-6b/main
    base_url: https://app-qwen3-06b-ujx67-router-9bufk.densemax.local/v1
    api_key: sk-no-key-required
    tokenizer: Qwen/Qwen3-0.6B

    infrastructure:
      backend: local
      workers: 2

    evaluations:
      - name: custom-mixed-evaluation
        benchmarks:
          - name: mixed_eval_test
            backend: custom_eval
            source: examples/datasets/custom_eval_test1.jsonl

            # Column mappings
            columns:
              instruction: instruction
              answer: answer
              eval_type: eval_type
              system_prompt: system_prompt
              judge_criteria: judge_criteria

            # Multiple choice config (optional columns)
            choices_columns: [option_a, option_b, option_c, option_d]
            choices_labels: [A, B, C, D]

            # Required here, not optional. This target sets a `tokenizer`, so
            # exact_match rows take the lm-eval path, and the answer keys in
            # this dataset are single letters. Without a mode the default is
            # `contains`, under which expected "B" is satisfied by any output
            # containing a "b" ("probably", "best", "because"), so the
            # benchmark scores near 100% whatever the model answers.
            # `.*` before the letter is load-bearing: it is greedy, so the
            # pattern anchors on the LAST standalone A-D rather than the
            # first. A model that reasons before answering ("A good answer
            # is B") otherwise scores its own preamble.
            #
            # No `flags: i`, also deliberate. Case-insensitively, a single
            # lowercase a-d is the English article "a" and the usual option
            # marker ("a) no  d) yes"), so `i` makes ordinary prose extract
            # the wrong letter. The cost is a model that answers purely in
            # lowercase, which extracts nothing and scores wrong: the safe
            # direction, and rare, since MCQ letters are near-always capital.
            matcher:
              mode: regex
              pattern: '.*\b([ABCD])\b'

            # Evaluation settings
            limit: 20
            max_tokens: 256

            # For judge rows (g-eval)
            judge_model:
              target: gpt4o-mini-judge
            judge_criteria: "Evaluate if the response correctly answers the question based on the expected answer."