task: boolq_generative
dataset_path: google/boolq
test_split: validation
output_type: generate_until
doc_to_text: |
  Read the passage and answer the question with Yes or No.

  Passage: {{passage}}

  Question: {{question}}

  Answer (Yes or No):
doc_to_target: "{{['No', 'Yes'][answer | int]}}"
generation_kwargs:
  until:
    - "\n"
  max_gen_toks: 5
  temperature: 0
filter_list:
  - name: "get_answer"
    filter:
      - function: "regex"
        regex_pattern: "(Yes|No)"
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true